name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Validate tag and set version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag '$env:GITHUB_REF_NAME' is not a valid version tag (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix)." }
          "TM_VERSION=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_ENV
      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          # v0.1.0-rc.1 uses the [0.1.0] section: strip any -suffix from the version
          $base = ($env:TM_VERSION -split '-')[0]
          $header = '^##\s+\[' + [regex]::Escape($base) + '\]'
          $notes = New-Object System.Collections.Generic.List[string]
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($inside -and $line -match '^##\s+\[') { break }
            if ($line -match $header) { $inside = $true; continue }
            if ($inside) { $notes.Add($line) }
          }
          if (-not $inside) { throw "CHANGELOG.md has no '## [$base]' section." }
          $text = ($notes -join "`n").Trim()
          if ($text.Length -eq 0) { throw "The '## [$base]' section of CHANGELOG.md is empty." }
          Set-Content -Path release-notes.md -Value $text -Encoding utf8
      - run: dotnet test tests/TibiaMirror.Tests -c Release
      - name: Publish
        shell: pwsh
        run: dotnet publish src/TibiaMirror/TibiaMirror.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$env:TM_VERSION" -p:DebugType=None -p:DebugSymbols=false -o publish
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish\* -DestinationPath "artifacts\TibiaMirror-Portable-$env:TM_VERSION.zip"
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\TibiaMirror.iss
          # Fixed-name copy so README's Download card can use releases/latest/download/TibiaMirror-Setup.exe
          Copy-Item "artifacts\TibiaMirror-Setup-$env:TM_VERSION.exe" "artifacts\TibiaMirror-Setup.exe"
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts -File | Where-Object Name -ne "SHA256SUMS.txt" | Sort-Object Name
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $f.Name }
          [System.IO.File]::WriteAllText("$PWD/artifacts/SHA256SUMS.txt", (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding $false))
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
